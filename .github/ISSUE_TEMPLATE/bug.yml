name: Bug report
description: "The Dispatcher plugin is broken or behaving unexpectedly"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The version fields below are required because they decide whether
        this is an already-fixed bug or a live one; without them the first reply is always
        "which version?".

        **This repository is public.** Before you paste a log or attach a screenshot, remove
        passwords, tokens, keys, callsigns, coordinates, hostnames and IP addresses you do not want published.
  - type: input
    id: version
    attributes:
      label: "Dispatcher plugin version"
      description: "Release tag or commit you installed."
      placeholder: "e.g. v1.2.0"
    validations:
      required: true
  - type: input
    id: cloudtak
    attributes:
      label: "CloudTAK version"
      description: "The plugin needs CloudTAK 13.45 or newer."
      placeholder: "e.g. 13.45.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: "How it was installed"
      options:
        - "infra-TAK console (CloudTAK Plugins marketplace)"
        - "install.sh (standalone CloudTAK)"
        - "Copied by hand"
        - "Other (say which below)"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: "Mode"
      options:
        - "Standalone"
        - "TAK-CAD"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: "Server OS and version"
      placeholder: "e.g. Ubuntu 22.04, Rocky Linux 9"
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: "Architecture"
      options:
        - "x86_64"
        - "ARM64 / aarch64"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Where it runs"
      options:
        - "Cloud (AWS, Azure, Oracle, other)"
        - "On-prem or home lab"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: "Browser and version"
      placeholder: "e.g. Chrome 130"
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: "What happened"
      description: |
        What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: |
        Red errors from the browser's developer console, and the CloudTAK API container's log around the time it happened (`docker logs <container>`). Paste as text rather than a screenshot where you can.
      render: shell
    validations:
      required: false
